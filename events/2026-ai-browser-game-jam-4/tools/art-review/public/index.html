<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VOLT NOMAD — Art Review</title>
    <meta name="theme-color" content="#09111f" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%2309111f%22 stroke=%22%234deeea%22 stroke-width=%223%22/><path d=%22M16 5v22M5 16h22%22 stroke=%22%23ffb703%22 stroke-width=%222%22/></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-lockup">
        <span class="eyebrow">PIXELLAB / HUMAN REVIEW</span>
        <h1>PROJECT <span>CHARGE</span></h1>
        <p>候補を増やす場所ではなく、ゲームに使う一案を決める場所。</p>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
    </header>

    <main>
      <section class="control-deck" aria-label="表示設定">
        <label>
          <span>バッチ</span>
          <select id="batch-filter"></select>
        </label>
        <label>
          <span>絞り込み</span>
          <select id="status-filter">
            <option value="all">すべて</option>
            <option value="recommended">Codex推奨</option>
            <option value="unreviewed">未確認</option>
            <option value="approved">採用</option>
            <option value="hold">保留</option>
            <option value="rejected">不採用</option>
          </select>
        </label>
        <label class="search-field">
          <span>検索</span>
          <input id="search" type="search" placeholder="名前・理由・プロンプト" />
        </label>
        <fieldset class="segmented" id="backdrop-control">
          <legend>確認背景</legend>
          <button type="button" data-backdrop="void" aria-pressed="true">暗</button>
          <button type="button" data-backdrop="panel" aria-pressed="false">紺</button>
          <button type="button" data-backdrop="checker" aria-pressed="false">透過</button>
          <button type="button" data-backdrop="light" aria-pressed="false">明</button>
        </fieldset>
        <fieldset class="segmented" id="scale-control">
          <legend>表示</legend>
          <button type="button" data-scale="fit" aria-pressed="true">Fit</button>
          <button type="button" data-scale="1" aria-pressed="false">1×</button>
          <button type="button" data-scale="2" aria-pressed="false">2×</button>
        </fieldset>
      </section>

      <section id="palette" class="palette" aria-label="固定パレット"></section>
      <section id="batch-intro" class="batch-intro"></section>
      <section id="candidate-grid" class="candidate-grid" aria-live="polite"></section>
      <div id="empty" class="empty" hidden>条件に一致する候補はありません。</div>
    </main>

    <aside id="compare-tray" class="compare-tray" hidden>
      <div class="compare-heading">
        <div><span class="eyebrow">QUICK COMPARE</span><strong>比較中</strong></div>
        <button id="clear-compare" type="button">すべて外す</button>
      </div>
      <div id="compare-items" class="compare-items"></div>
    </aside>

    <dialog id="preview-dialog">
      <button id="close-dialog" class="dialog-close" type="button" aria-label="閉じる">×</button>
      <div id="dialog-content"></div>
    </dialog>

    <template id="candidate-template">
      <article class="candidate-card">
        <div class="card-topline">
          <div class="badges"></div>
          <label class="compare-toggle"><input type="checkbox" /> 比較</label>
        </div>
        <button class="preview-button" type="button">
          <div class="preview-frame"><div class="placeholder">生成待ち</div></div>
        </button>
        <div class="card-body">
          <div class="title-row">
            <div><span class="candidate-id"></span><h3></h3><p class="title-en"></p></div>
            <div class="score" hidden><strong></strong><span>/100</span></div>
          </div>
          <p class="codex-summary"></p>
          <div class="review-points"></div>
          <details>
            <summary>生成条件と完全プロンプト</summary>
            <dl class="metadata"></dl>
            <p class="prompt"></p>
          </details>
          <form class="review-form">
            <fieldset class="decision-buttons">
              <legend>あなたの判断</legend>
              <button type="button" data-status="approved">採用</button>
              <button type="button" data-status="hold">保留</button>
              <button type="button" data-status="rejected">不採用</button>
            </fieldset>
            <label class="rating-label">評価
              <select class="rating">
                <option value="">—</option>
                <option value="5">5 / とても良い</option>
                <option value="4">4 / 良い</option>
                <option value="3">3 / 可能性あり</option>
                <option value="2">2 / 弱い</option>
                <option value="1">1 / 合わない</option>
              </select>
            </label>
            <label>メモ
              <textarea class="review-note" rows="2" placeholder="好きな部分、直したい部分"></textarea>
            </label>
            <button class="save-review" type="submit">判断を保存</button>
            <span class="save-state" role="status"></span>
          </form>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
