name: Test and deploy Godot Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.6.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true

      - name: Run gameplay smoke tests
        run: >-
          godot --headless
          --path events/2026-ai-browser-game-jam-4/godot
          -s res://tests/smoke_test.gd

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless \
            --path events/2026-ai-browser-game-jam-4/godot \
            --export-release Web \
            "$GITHUB_WORKSPACE/build/web/index.html"
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
